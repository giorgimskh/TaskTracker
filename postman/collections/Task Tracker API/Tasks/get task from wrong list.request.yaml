$kind: http-request
method: GET
url: '{{base_url}}/task_list/{{unknown_id}}/tasks/{{task_id}}'
order: 7000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200 (empty Optional, not 404)", () => pm.response.to.have.status(200));
      pm.test("lookup is scoped to the list, so body is empty or null", () =>
        pm.expect(["", "null"]).to.include(pm.response.text().trim()));
