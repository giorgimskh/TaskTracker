$kind: http-request
method: GET
url: '{{base_url}}/task_list/{{task_list_id}}/tasks/{{task_id}}'
order: 15000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      pm.test("task is gone", () =>
        pm.expect(["", "null"]).to.include(pm.response.text().trim()));
