$kind: http-request
method: GET
url: '{{base_url}}/api/task-lists/{{unknown_id}}'
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200 (empty Optional, not 404)", () => pm.response.to.have.status(200));
      pm.test("body is empty or null", () =>
        pm.expect(["", "null"]).to.include(pm.response.text().trim()));
