$kind: http-request
method: GET
url: '{{base_url}}/api/task-lists/{{task_list_id}}'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      pm.test("list is gone", () =>
        pm.expect(["", "null"]).to.include(pm.response.text().trim()));
