$kind: http-request
method: POST
url: '{{base_url}}/api/task-lists/{{unknown_id}}/tasks'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "orphan"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 404", () => pm.response.to.have.status(404));
      pm.test("reports not found", () =>
        pm.expect(pm.response.json().message).to.eql("Task list not found"));
