$kind: http-request
method: PUT
url: '{{base_url}}/api/task-lists/{{unknown_id}}'
order: 9000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "id": "{{unknown_id}}",
      "title": "missing"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 404", () => pm.response.to.have.status(404));
      pm.test("reports not found", () =>
        pm.expect(pm.response.json().message).to.eql("Task list not found"));
